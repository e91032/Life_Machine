<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生機 — 一個人的一輩子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --page:#E6E1D6; --page2:#D8D2C4;
  --ink:#2B2822; --ink-soft:#6B6457;
  --shell:#C3B6D8; --shell-hi:#D6CCE6; --shell-lo:#9C8EB6; --shell-ink:#4A3F5C;
  --btn:#F2ECE0; --btn-lo:#CFC6B4;
  --accent:#E8405F; --accent-lo:#B32A44;
  --lcd:#141D27; --lcd-glow:#E9E3D4;
  --tape:#FBF6E9; --tape-ink:#4A4336; --tape-line:#DED5BF;
  --shadow:rgba(60,50,40,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#17181B; --page2:#202126; --ink:#E8E4DB; --ink-soft:#9A948A;
    --shell:#8E82A6; --shell-hi:#A79BBE; --shell-lo:#5F5574; --shell-ink:#1E1926;
    --btn:#CFC8BC; --btn-lo:#8D8778;
    --tape:#E6DFCE; --tape-ink:#433D31; --tape-line:#CDC3AC;
    --shadow:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#17181B; --page2:#202126; --ink:#E8E4DB; --ink-soft:#9A948A;
  --shell:#8E82A6; --shell-hi:#A79BBE; --shell-lo:#5F5574; --shell-ink:#1E1926;
  --btn:#CFC8BC; --btn-lo:#8D8778; --tape:#E6DFCE; --tape-ink:#433D31;
  --tape-line:#CDC3AC; --shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  background-image:radial-gradient(circle at 50% 0%,var(--page2),var(--page) 70%);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  min-height:100%; padding:20px 14px 48px;
}
.wrap{max-width:1060px;margin:0 auto;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;justify-content:center}

.machine{
  flex:1 1 440px;max-width:540px;min-width:300px;
  background:linear-gradient(170deg,var(--shell-hi),var(--shell) 45%,var(--shell-lo));
  border-radius:38px 38px 46px 46px; padding:16px 16px 20px;
  box-shadow:0 18px 40px -12px var(--shadow),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -6px 14px rgba(0,0,0,.18);
}
.brand{display:flex;align-items:center;justify-content:space-between;padding:2px 10px 12px;color:var(--shell-ink)}
.brand .dots{display:flex;gap:6px}
.brand .dots i{width:7px;height:7px;border-radius:50%;background:var(--shell-lo);box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.brand h1{margin:0;font-size:15px;font-weight:900;letter-spacing:.14em}
.brand small{font-family:VT323,monospace;font-size:17px;opacity:.65}

.screen{
  background:var(--lcd); border-radius:16px; padding:12px 13px 10px;
  position:relative;overflow:hidden;
  box-shadow:inset 0 3px 14px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.4);
  color:var(--lcd-glow); min-height:372px; display:flex;flex-direction:column;
  transition:filter .12s ease;
}
.screen.tick{filter:brightness(1.22)}
.screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);
}
.screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.35));
}
.hud{display:flex;justify-content:space-between;align-items:baseline;font-family:VT323,monospace;font-size:21px;line-height:1}
.hud .age b{font-size:34px;font-weight:400;display:inline-block;transition:transform .18s cubic-bezier(.3,1.7,.5,1)}
.hud .age b.pop{transform:scale(1.35) translateY(-2px)}
.hud .who{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.06em;opacity:.8}
.hud .cash{color:#F5D77A;text-shadow:0 0 10px rgba(245,215,122,.35)}
.yearbar{height:3px;background:rgba(0,0,0,.3);border-radius:2px;margin:7px 0 4px;overflow:hidden}
.yearbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6FD08C,#F2D06B);opacity:.9}

/* 場景 */
.scene{flex:0 0 auto;display:flex;gap:10px;align-items:flex-end}
.stageview{position:relative;width:146px;height:92px;flex:0 0 146px;
  border-radius:7px;overflow:hidden;background:#2A3340;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 6px 14px rgba(0,0,0,.3);
  transition:background .6s ease}
.stageview .bg{position:absolute;inset:0;width:100%;height:100%}
.sprite{position:absolute;left:4px;bottom:3px;width:62px}
.sprite svg,.stageview .bg{display:block}
.sprite svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.sprite{animation:bob 2.8s ease-in-out infinite}
.sprite.jump{animation:jump .5s ease-out}
.sprite.shake{animation:shake .4s linear}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-16px)}60%{transform:translateY(0) scaleY(.9)}100%{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx span{position:absolute;font-family:VT323,monospace;font-size:19px;animation:rise 1.25s ease-out forwards;opacity:0;text-shadow:0 1px 2px rgba(0,0,0,.6)}
@keyframes rise{0%{opacity:0;transform:translateY(6px) scale(.6)}18%{opacity:1}100%{opacity:0;transform:translateY(-44px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){
  .sprite,.sprite.jump,.sprite.shake{animation:none}
  .fx span{animation-duration:.01s}
  .screen.tick{filter:none}
}

.bars{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;min-width:0;align-self:center}
.bar{font-size:10px;font-weight:700;letter-spacing:.04em}
.bar span{display:flex;justify-content:space-between;opacity:.85;margin-bottom:1px}
.bar span em{font-style:normal;font-family:VT323,monospace;font-size:13px}
.bar i{display:block;height:5px;background:rgba(0,0,0,.32);border-radius:1px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--lcd-glow);transition:width .5s ease,background .4s}
.bar.warn i b{background:var(--accent)!important}

.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;min-height:15px}
.chips b{font-size:9.5px;font-weight:700;border:1px solid rgba(233,227,212,.34);border-radius:20px;padding:1px 6px;opacity:.85}
.chips b.ill{border-color:rgba(232,64,95,.75);color:#F0909F}
.family{display:flex;gap:4px;align-items:center;font-size:10.5px;margin-top:5px;opacity:.85;flex-wrap:wrap;min-height:14px}
.family b{font-weight:700}
.ticker{border-top:1px dashed rgba(233,227,212,.22);margin-top:7px;padding-top:6px;font-size:11.5px;line-height:1.55;min-height:56px}
.ticker p{margin:0 0 2px;opacity:.5}
.ticker p:last-child{opacity:1;font-weight:500}
.ticker p u{text-decoration:none;font-family:VT323,monospace;font-size:14px;margin-right:6px;opacity:.7}

.overlay{
  position:absolute;inset:0;background:var(--lcd);z-index:5;
  padding:15px;display:none;flex-direction:column;justify-content:center;
  animation:pop .22s ease-out;
}
.overlay.on{display:flex}
@keyframes pop{from{transform:scale(.96) translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.overlay{animation:none}}
.overlay h2{margin:0 0 7px;font-size:17px;font-weight:900;letter-spacing:.03em}
.overlay .kicker{font-family:VT323,monospace;font-size:15px;opacity:.6;letter-spacing:.1em}
.overlay p.body{margin:0 0 13px;font-size:12.5px;line-height:1.7;opacity:.9}
.choices{display:flex;flex-direction:column;gap:6px}
.choices button{
  text-align:left;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
  background:rgba(255,255,255,.07);color:var(--lcd-glow);
  border:1px solid rgba(233,227,212,.3);border-radius:8px;padding:8px 11px;
  transition:background .14s,transform .12s;
}
.choices button:hover{background:rgba(255,255,255,.17)}
.choices button:active{transform:translateY(1px)}
.choices button small{display:block;opacity:.6;font-size:10.5px;margin-top:2px;font-weight:400}
.choices button:focus-visible,.ctrl:focus-visible,.focus-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.controls{padding:14px 4px 0}
.row-speed{display:flex;gap:8px;align-items:center;margin-bottom:13px}
.ctrl{
  width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(180deg,var(--btn),var(--btn-lo));
  box-shadow:0 3px 0 var(--shell-lo),0 5px 8px rgba(0,0,0,.2);
  color:var(--shell-ink);font-size:15px;font-weight:700;font-family:VT323,monospace;
  display:grid;place-items:center;transition:transform .08s,box-shadow .08s;
}
.ctrl:active{transform:translateY(3px);box-shadow:0 0 0 var(--shell-lo)}
.ctrl[aria-pressed="true"]{background:linear-gradient(180deg,var(--accent),var(--accent-lo));color:#fff}
.ctrl.wide{width:auto;padding:0 14px;border-radius:21px;font-family:"Noto Sans TC",sans-serif;font-size:12px}
.speed-label{margin-left:auto;font-size:11px;color:var(--shell-ink);font-weight:700;opacity:.8}
.focus-title{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--shell-ink);opacity:.75;margin:0 0 7px 2px}
.focus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.focus-btn{
  font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:10px 4px;
  border-radius:11px;border:1.5px solid transparent;
  background:linear-gradient(180deg,var(--btn),var(--btn-lo));color:var(--shell-ink);
  box-shadow:0 2px 0 var(--shell-lo);transition:transform .08s,box-shadow .08s;
}
.focus-btn:active{transform:translateY(2px);box-shadow:none}
.focus-btn[aria-pressed="true"]{
  background:linear-gradient(180deg,var(--accent),var(--accent-lo));color:#fff;
  box-shadow:0 2px 0 var(--accent-lo),0 0 0 3px rgba(232,64,95,.22);
}

.tape{
  flex:1 1 300px;max-width:360px;min-width:260px;
  background:var(--tape);color:var(--tape-ink);
  border-radius:3px;padding:18px 18px 0;
  box-shadow:0 14px 30px -14px var(--shadow);
  position:relative;font-size:12.5px;line-height:1.6;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);
}
.tape::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;
  background:repeating-linear-gradient(90deg,var(--page) 0 7px,transparent 7px 14px)}
.tape h3{margin:8px 0 2px;font-size:12px;font-weight:900;letter-spacing:.16em}
.tape .sub{margin:0 0 12px;font-size:11px;opacity:.6;border-bottom:1px dashed var(--tape-line);padding-bottom:10px}
.tape-list{max-height:470px;overflow:auto;padding-bottom:26px;scrollbar-width:thin}
.tape-list div{display:flex;gap:9px;padding:3px 0;border-bottom:1px dotted var(--tape-line);animation:slip .3s ease-out}
@keyframes slip{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tape-list div{animation:none}}
.tape-list div u{text-decoration:none;font-family:VT323,monospace;font-size:15px;opacity:.55;flex:0 0 26px;text-align:right}
.tape-list div.good u{color:#3E7A3E;opacity:1}
.tape-list div.bad u{color:var(--accent-lo);opacity:1}
.tape-list div.key{font-weight:700}
.tape-empty{opacity:.5;padding:12px 0}

.result .grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:11.5px;margin:9px 0 11px}
.result .grid span{display:flex;justify-content:space-between;border-bottom:1px dotted rgba(233,227,212,.2);padding:2px 0}
.result .grid span em{font-style:normal;font-family:VT323,monospace;font-size:15px}
.result .score{font-family:VT323,monospace;font-size:42px;line-height:.9;color:#fff}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.badges b{font-size:10px;font-weight:700;border:1px solid rgba(233,227,212,.42);border-radius:20px;padding:2px 8px}
.hint{font-size:11px;color:var(--ink-soft);text-align:center;width:100%;margin:4px 0 0;line-height:1.7}
.scroll-in{overflow:auto}
@media (max-width:720px){
  .machine,.tape{max-width:100%}
  .tape-list{max-height:260px}
  .stageview{width:124px;flex:0 0 124px;height:86px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="machine">
    <div class="brand">
      <div class="dots"><i></i><i></i></div>
      <h1>人生機</h1>
      <small>LIFE-84</small>
    </div>

    <div class="screen" id="screen">
      <div class="hud">
        <div class="age"><b id="age">0</b> 歲 <span class="who" id="stageName">出生</span></div>
        <div class="cash" id="cash">$0</div>
      </div>
      <div class="yearbar"><i id="yearbar"></i></div>

      <div class="scene">
        <div class="stageview">
          <svg class="bg" id="bg" viewBox="0 0 80 48" shape-rendering="crispEdges" aria-hidden="true"></svg>
          <div class="sprite" id="sprite"></div>
          <div class="fx" id="fx"></div>
        </div>
        <div class="bars" id="bars"></div>
      </div>

      <div class="chips" id="chips"></div>
      <div class="family" id="family"></div>
      <div class="ticker" id="ticker"></div>

      <div class="overlay" id="event">
        <div class="kicker" id="evAge">AGE 00</div>
        <h2 id="evTitle"></h2>
        <p class="body" id="evText"></p>
        <div class="choices" id="evChoices"></div>
      </div>

      <div class="overlay on scroll-in" id="startScreen">
        <div class="kicker">NEW LIFE</div>
        <h2 id="birthTitle">投胎中…</h2>
        <p class="body" id="birthText"></p>
        <div class="choices">
          <button id="btnStart">開始這一生</button>
          <button id="btnReroll">重新投胎 <small id="rerollLeft">還可以換 3 次</small></button>
          <button id="btnHeavy">沉重劇情：開 <small>性騷擾、性侵與創傷相關的情節</small></button>
        </div>
      </div>

      <div class="overlay result scroll-in" id="endScreen"></div>
    </div>

    <div class="controls">
      <div class="row-speed">
        <button class="ctrl" id="sp0" aria-pressed="false" title="暫停">❙❙</button>
        <button class="ctrl" id="sp1" aria-pressed="true" title="正常速度">▶</button>
        <button class="ctrl" id="sp2" aria-pressed="false" title="兩倍速">▶▶</button>
        <button class="ctrl" id="sp4" aria-pressed="false" title="四倍速">▶▶▶</button>
        <button class="ctrl wide" id="stepBtn" title="手動過一年">過一年</button>
        <span class="speed-label" id="speedLabel">一年約 2.6 秒</span>
      </div>
      <p class="focus-title">這幾年的重心</p>
      <div class="focus-grid" id="focusGrid"></div>
    </div>
  </div>

  <div class="tape">
    <h3>人生紀事</h3>
    <p class="sub" id="tapeSub">尚未出生</p>
    <div class="tape-list" id="tapeList"><div class="tape-empty">這台機器會把每一年印出來。</div></div>
  </div>

  <p class="hint">選一個重心，時間就會自己往前走。壓力是慢性毒，心情歸零會出事。</p>
</div>

function palette(){

  return {S:sk[0], s:sk[1], H:hair, E:"#1B1A22", M:"#A85E5E",
          A:o.c1, B:o.c2, K:o.ac, F:o.sh, L:o.c2, R:o.c2};
}
function spriteKey(){
  const k = stageKey(), g = S.sex === "F" ? "F" : "M";
  if (k === "baby" || k === "toddler") return "baby";
  if (k === "primary") return "child"+g;
  if (k === "junior" || k === "senior" || k === "uni" || k === "abroad") return "teen"+g;
  if (k === "retire" || S.age >= 72) return "elder"+g;
  if (S.age >= 46) return "mid"+g;
  return "adult"+g;
}
function spriteSVG(key, blink, step){
  const g = SPR[key] || SPR.adultM, P = palette();
  const occ = {}, cells = [];
  for (let y=0;y<g.length;y++) for (let x=0;x<g[y].length;x++){
    const c = g[y][x];
    if (c === ".") continue;
    let fill = P[c], yy = y;
    if (c === "E") fill = blink ? P.s : P.E;
    if (step && (c === "L" || (c === "F" && x < 8))) yy = y - 1;
    if (!fill) continue;
    occ[x+","+yy] = 1; cells.push([x,yy,fill]);
  }
  // 沿著外緣補一圈深色，像素畫靠這個才看得出輪廓
  const ring = {};
  for (const c of cells){
    const x = c[0], y = c[1];
    const n = [[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
    for (const q of n) if (!occ[q[0]+","+q[1]]) ring[q[0]+","+q[1]] = 1;
  }
  const r = [];
  for (const k in ring){
    const q = k.split(",");
    r.push('<rect x="'+q[0]+'" y="'+q[1]+'" width="1" height="1" fill="#10141A" opacity=".55"/>');
  }
  for (const c of cells)
    r.push('<rect x="'+c[0]+'" y="'+c[1]+'" width="1" height="1" fill="'+c[2]+'"/>');
  return '<svg viewBox="-1 -1 18 18" shape-rendering="crispEdges" aria-hidden="true">'+r.join("")+'</svg>';
}

function fx(glyphs, n, col){
  if (speed > 2) return;
  const box = $("fx");
  for (let i=0;i<(n||3);i++){
    const s = document.createElement("span");
    s.textContent = pick(glyphs);
    s.style.color = col || "#F2D06B";
    s.style.left = (10 + Math.random()*48) + "px";
    s.style.bottom = (10 + Math.random()*28) + "px";
    s.style.animationDelay = (i*0.12) + "s";
    box.appendChild(s);
    setTimeout(() => s.remove(), 1700);
  }
}

  const sp = $("sprite");

}

const DEG = {"無":0,"高中":1,"大學":2,"碩士":3,"博士":4};
function jobOK(j){
  const n = j.need;
  if (n.degree && DEG[S.degree] < DEG[n.degree]) return false;
  if (n.intel && S.st.intel < n.intel) return false;
  if (n.fit && S.st.fit < n.fit) return false;
  if (n.charm && S.st.charm < n.charm) return false;
  if (n.major && S.major !== n.major) return false;
  if (n.tier && (TIER[S.uniTier] === undefined || TIER[S.uniTier] < n.tier)) return false;
  if (S.record && j.pres >= 3) return false;          // 有前科，正經單位不收
  if (S.flags.leaked && j.pres >= 4) return false;     // 影片還在網路上，高階職位會查
  if (j.hidden) return false;                          // 八大與道上不會出現在求職清單
  return true;
}

function takeJob(j){
  const tm = {"頂大":1.16,"國立":1.06,"私立":0.97,"科大":0.92}[S.uniTier] || 1;
  const em = 1 + S.econ * 0.06;
  S.job = {t:j.t, pay:Math.max(30,Math.round(j.pay*tm*em*rnd(0.9,1.12))),
           pres:j.pres, cat:j.cat||"svc", gr:j.gr||1, vol:j.vol||0, years:0};
  if (j.pres >= 5) badge("人生勝利組");
}

/* ===================== 里程碑 ===================== */
function milestone(){
  const a = S.age;
  if (a === 1){
    if (S.st.fit > 62) logit("十個月就會走路了，而且很快變成跑。","good");
    else if (S.st.fit < 35) logit("一歲半還在扶著牆走，媽媽有點擔心。","bad");
    else logit("你會走路了，第一步就撲進沙發。","good");
    return null;
  }
  if (a === 6){ logit("背起書包上小學，書包比你還重。",null,true); return null; }
  if (a === 12) return junior();
  if (a === 15) return exam15();
  if (a === 18) return exam18();
  if (a === 19 && S.flags.redo){ S.flags.redo = false; return exam18(); }
  if (S.path === "uni" && a === (S.uniEnd||22)) return afterUni();
  if ((S.path === "grad" || S.path === "abroad") && a === (S.gradEnd||24)) return afterGrad();
  if (a >= 18 && stageKey() === "work" && !S.job && !S.retired) return findJob();
  return null;
}
function junior(){
  if (S.st.intel > 76){ S.flags.gifted = true; badge("資優班");
    return {t:"你被編進資優班",d:"全年級前三十名，老師說要好好把握。",
      c:[{l:"接受，跟著拚",e:{intel:9,mood:-6,stress:16},g:"每天小考，排名貼在牆上。"},
         {l:"申請轉回普通班",e:{mood:9,social:6,intel:-3,stress:-12},g:"你想過正常一點的國中生活。"}]};
  }
  logit("升上國中，制服永遠大一號。",null,true); return null;
}
// 考試不是智力的直接投影：臨場、壓力、睡眠、準備都算進去
function examScore(){
  let v = S.st.intel * 0.92;
  if (S.flags.cram) v += 7;
  if (S.flags.gifted) v += 6;
  if (S.flags.repeat) v += 6;
  if (S.school === "第一志願") v += 7;
  else if (S.school === "前段高中") v += 3;
  if (S.flags.voc) v -= 7;
  if (S.focus === "用功讀書" || S.focus === "專心學業") v += 5;
  v -= Math.max(0, S.st.stress - 58) * 0.3;
  if (ill("失眠")) v -= 5;
  if (ill("憂鬱症")) v -= 11;
  v += (S.st.luck - 50) * 0.14;
  v += rnd(-17, 17);
  return v;
}
function exam15(){
  const sc = examScore();
  let school, eff, note;
  if (sc > 93){ school="第一志願"; eff={mood:16,social:6,stress:12}; note="全校只有幾個人上得了。"; badge("第一志願"); }
  else if (sc > 80){ school="前段高中"; eff={mood:10,stress:6}; note="差一點點，但也很不錯了。"; }
  else if (sc > 64){ school="社區高中"; eff={mood:3}; note="離家近，也沒什麼不好。"; }
  else if (sc > 48){ school="後段高中"; eff={mood:-6,stress:-4}; note="班上沒幾個人在念書。"; }
  else { school="高職"; eff={mood:-4,fit:5,stress:-8}; S.flags.voc=true; note="你開始摸到真的機器。"; }
  S.school = school;
  return {t:"會考成績出來了", d:"你的分數落在 "+school+"。"+note,
    c:[{l:"接受，去念 "+school, e:eff, g:"新制服比舊制服好看一點。"}]};
}
function enterUni(tier){

function exam18(){
  S.degree = "高中";
  const sc = examScore();
  let tier, td;
  if (sc > 92){ tier="頂大"; td="落點在台成清交那幾間。"; }
  else if (sc > 78){ tier="國立"; td="落點在中字輩的國立大學。"; }
  else if (sc > 60){ tier="私立"; td="上得了私立大學，但學費不便宜。"; }
  else { tier="科大"; td="剩下的志願只有私立科大。"; }
  const opts = [{
    l:"去念"+tier+"大學",
    e:{mood: tier==="頂大"?15:tier==="國立"?9:tier==="私立"?2:-2, cash: tier==="私立"?-40:tier==="科大"?-30:0},

  }];

  if (!S.flags.repeat) opts.push({l:"重考一年拚看看",e:{mood:-12,intel:7,cash:-45,stress:20},g:"",run:()=>{
    S.flags.repeat=true; S.flags.redo=true; S.path="repeat";
    logit("你退掉所有志願，開始第二次。",null,true); }});
  return {t:"學測放榜",d:td+"級分單在手上，整個人生好像被印成一張紙。",c:opts};
}
function chooseMajor(){

function afterGrad(){
  S.degree = "碩士"; S.path = "work";
  if (S.st.intel > 84 && chance(0.45)) return {
    t:"教授問你要不要念博士",d:"他說你是這幾年最好的學生之一。",
    c:[{l:"念下去",e:{intel:12,mood:-12,cash:-40,stress:18},g:"",run:()=>{S.degree="博士";S.gradEnd=S.age+4;S.path="grad";badge("博士");logit("又多讀了四年，頭髮少了一些。",null,true)}},
       {l:"先去工作",e:{mood:5},g:"你想先賺點錢。"}]};
  logit("碩士畢業，履歷終於可以寫滿一頁。",null,true); return null;
}
function findJob(){
  const pool = JOBS.filter(jobOK), picks = [];
  while (picks.length < 3 && pool.length){      // 依薪水加權隨機，同樣條件每次開出的缺不一樣
    const w = pool.map(j => Math.pow(j.pay, 1.5));
    let r = Math.random() * w.reduce((a,b)=>a+b,0), i = 0;
    for (; i < pool.length-1; i++){ r -= w[i]; if (r <= 0) break; }
    picks.push(pool.splice(i,1)[0]);
  }
  if (!picks.length) picks.push(JOBS[0]);
  const opts = picks.map(j => {
    const tm = {"頂大":1.16,"國立":1.06,"私立":0.97,"科大":0.92}[S.uniTier] || 1;
    const show = Math.round(j.pay * tm * (1 + S.econ*0.06));
    return {l:j.t+"（年薪約 "+show+" 萬）",e:{},g:"",run:()=>{takeJob(j);logit("開始當"+j.t+"，年薪 "+S.job.pay+" 萬。",null,true)}};
  });
  opts.push({l:"再休息一陣子",e:{mood:6,cash:-20},g:"你說你在沉澱。"});
  const mood = S.econ < 0 ? "景氣不好，投了快一百封才有這幾個。" : "投了四十幾封履歷，有回音的有這幾個。";
  return {t:"找工作",d:mood,c:opts};
}

function divorce(){
  if (!S.partner) return;
  const n = S.partner.name;
  money(-Math.max(S.money,0)*0.45);
  add("mood",-20); add("stress",18); S.exes++; badge("離過婚");
  if (S.flags.fakeMarry){ S.flags.fakeMarry = false; add("mood",26); add("stress",-28); logit("這段婚姻結束的時候，你反而鬆了一口氣。","good"); }
  S.kids.forEach(k => { k.bond -= 12; });
  S.partner = null;
  logit("你跟"+n+"離婚了。房子裡少了一半的東西。","bad",true);
}

/* ===================== 年度推進 ===================== */
function applyEff(e){
  if (!e) return;
  for (const k in e){ if (k === "cash") money(e[k]); else add(k, e[k]); }
}
function yearlyFocus(){
  const f = S.focus; if (!f || !FOCUS[f]) return;
  applyEff(FOCUS[f]);
  if (f === "投資理財" && S.money > 0) money(S.money * (rnd(-0.21,0.26) + (S.st.intel-50)/900 + (S.st.luck-50)/1400 + S.econ*0.045));
  if (f === "談戀愛" || f === "偷偷戀愛" || f === "陪伴家人"){
    if (S.partner) S.partner.aff = Math.min(100, S.partner.aff + 9);
    S.kids.forEach(k => k.bond = Math.min(100, k.bond + 8));
  }
  if (f === "含飴弄孫") S.kids.forEach(k => k.bond = Math.min(100, k.bond + 5));
  if (f === "朋友社交" && S.friend) S.friend.bond = Math.min(100, S.friend.bond + 8);
}
function yearlyEconomy(){
  // 大環境會自己起伏，每一輪人生碰到的景氣都不一樣
  if (S.age >= S.econUntil){
    const prev = S.econ;
    S.econ = wpick([{v:-1,w:3},{v:0,w:5},{v:1,w:3}]).v;
    S.econUntil = S.age + ri(5,11);
    if (S.age >= 20 && S.econ !== prev){
      if (S.econ === 1) logit("景氣轉好，到處都在徵人。","good");
      else if (S.econ === -1) logit("景氣變差，新聞每天都在講裁員。","bad");
    }
  }
  const k = stageKey();

  // 服刑中：沒有收入，只有時間在走
  if (k === "jail"){
    S.jail--;
    add("social",-2);
    if (S.jail <= 0){
      S.job = null; S.record = true; badge("關過");
      logit("刑期結束，你走出大門，外面的街道變了很多。",null,true);
    }
    money(-6);
    return;
  }

  if (S.job){
    const jb = S.job;
    let mul = 1;
    if (jb.cat === "night") mul = S.focus === "拼業績" ? 1.45 : S.focus === "少喝一點" ? 0.72 : S.focus === "存錢轉行" ? 0.85 : 1;
    else if (jb.cat === "gang") mul = S.focus === "跑場子" ? 1.35 : S.focus === "低調度日" ? 0.6 : S.focus === "洗白事業" ? 0.85 : 1;
    else mul = S.focus === "拼事業" ? 1.25 : S.focus === "摸魚度日" ? 0.95 : 1;
    let inc = jb.pay * mul;
    if (jb.vol) inc *= rnd(1-jb.vol, 1+jb.vol);
    money(inc);
    jb.years++;
    const pr = ((S.focus === "拼事業" ? 0.26 : 0.09) * (jb.gr||1)
                + (S.st.intel + S.st.social)/1600) * (1 + S.econ*0.45);
    if (jb.cat !== "night" && jb.cat !== "gang" && jb.years >= 3 && roll(pr)){
      jb.pay = Math.round(jb.pay * rnd(1.07,1.2)); jb.years = 1;
      logit(RAISE[jb.cat] ? RAISE[jb.cat]() : "升職加薪，年薪變 "+jb.pay+" 萬。","good");
    }
    if (S.focus === "摸魚度日" && chance(0.06 + (S.econ<0?0.05:0))){
      logit("被委婉地請走了。","bad",true); S.job = null;
    }
  }
  if (k === "retire") money(rnd(18,32));
  if (S.gang > 0 && !S.job && S.jail <= 0) money(rnd(30,80));

  // 道上的風險：混愈大，進去的機會愈高
  if (S.gang > 0 && S.jail <= 0){
    const quiet = S.focus === "低調度日" ? 0.45 : S.focus === "洗白事業" ? 0.7 : 1;
    if (chance(0.055 * S.gang * quiet)){
      if (chance(0.55)){
        S.jail = ri(2, 3 + S.gang*2); S.job = null;
        logit("被抓了。法官判了 "+S.jail+" 年。","bad",true);
      } else {
        add("health",-rnd(10,26)); add("fit",-8); getIll("舊傷");
        logit("在巷子裡被堵，送醫縫了很多針。","bad",true);
      }
    }
  }

  let cost = 0;
  if (S.age >= 18) cost += 26 * S.place.cost;
  cost += S.kids.filter(kd => S.age - kd.born < 24).length * 16;
  if (S.flags.loan > 0){ cost += 42; S.flags.loan--; if (S.flags.loan === 0) logit("房貸終於繳完了。","good",true); }
  money(-cost);

  // 債務會利滾利
  if (S.money < -15){
    if (!S.debtKind) S.debtKind = "卡債";
    const rate = S.debtKind === "錢莊" ? rnd(0.3,0.55) : S.debtKind === "卡債" ? rnd(0.09,0.15) : 0.03;
    money(S.money * rate);
    if (!S.flags.debtWarn && S.money < -90){
      S.flags.debtWarn = true;
      logit("利息滾起來了，現在欠的比當初借的還多。","bad",true);
    }
  } else if (S.money >= 0 && S.debtKind){
    S.debtKind = null; S.flags.debtWarn = false;
    logit("你把債還清了。那張收據你留了很久。","good",true);
  }

  if (S.money < 0){ S.debtYears++; add("mood",-6); add("stress",8);
    if (S.debtYears === 3) logit("帳單堆成一疊，你開始算哪一張可以晚點繳。","bad");
  } else S.debtYears = 0;
}
function yearlyDrift(){
  const a = S.age;
  if (a > 35) add("health", -((a-35)/22));
  if (a > 58) add("fit", -1);
  S.st.fit = clamp(S.st.fit + (34 - S.st.fit) * 0.08);
  if (S.st.fit < 35) add("health",-0.8);
  if (S.st.fit > 70) add("health",0.8);
  if (a < 45 && S.st.health < 72) add("health",2.4);
  else if (a < 62 && S.st.health < 50) add("health",1.2);

  // 壓力：會自己消一點，但高壓會磨掉健康跟心情
  S.st.stress = clamp(S.st.stress * 0.88);
  if (S.st.stress > 72){ add("health", -(S.st.stress-72)/16); add("mood", -(S.st.stress-72)/10); }
  if (S.st.stress < 25) add("mood", 2);

  // 身體狀況的長期影響
  if (ill("慢性病")) { add("health",-2.2); add("fit",-1); }
  if (ill("失眠"))   { add("health",-1.2); add("mood",-2.5); add("intel",-0.6); }
  if (ill("腰傷"))   { add("fit",-1.8); }
  if (ill("憂鬱症")) { add("mood",-5); add("social",-1.5); }
  if (ill("肝指數過高")) { add("health",-2.6); add("charm",-0.8); }
  if (ill("酒精依賴")) { add("health",-3); add("mood",-3); add("intel",-1); }
  if (ill("創傷壓力")) {
    add("mood",-5); add("stress",6); add("social",-1.5);
    if (S.partner) S.partner.aff -= 1.5;
    if (chance(0.035)) { cureIll("創傷壓力"); logit("有一天你發現自己已經很久沒有夢到那件事了。","good",true); }
  }
  if (ill("長新冠")) { add("fit",-1.5); add("health",-1); }
  if (ill("舊傷"))   { add("fit",-1.2); add("health",-0.6); }
  if (ill("近視") && a < 25) add("intel",0.3);

  S.st.mood += (58 - S.st.mood) * 0.07;
  if (S.st.health < 35) add("mood",-3);

  if (S.partner){
    const f = S.focus;
    if (f !== "陪伴家人" && f !== "談戀愛" && f !== "偷偷戀愛"){
      S.partner.aff -= S.partner.married ? rnd(0.4,1.9) : rnd(0.9,2.4);
    }
    if (S.partner.married && S.partner.aff < 12 && chance(0.4)) divorce();
    else if (!S.partner.married && S.partner.aff < 14){
      logit("你們淡掉了，最後一則訊息沒人回。","bad",true); S.partner = null; S.exes++;
    }
  }
  // 還沒跟任何人說的那段時間，是有重量的
  if (S.flags.realized && S.orient !== "straight" && S.out === 0){ add("stress",4); add("mood",-2); }
  if (S.flags.fakeMarry){ add("mood",-4); add("stress",5); }
  // 外遇不會停在發生那一刻，它會一直在那裡
  if (S.lover){
    S.lover.years++;
    S.lover.risk += 7 + (S.kids.length ? 3 : 0) + (S.st.charm > 70 ? 2 : 0)
                     - (S.focus === "陪伴家人" ? 6 : 0);
    S.lover.risk = Math.max(5, S.lover.risk);
    add("stress", 6);
    if (S.partner) S.partner.aff -= 2;
  }
  if (S.friend){ S.friend.bond -= 1.5; if (S.friend.bond <= 0){ logit("跟"+S.friend.name+"愈來愈少聯絡，最後只剩生日罐頭訊息。","bad"); S.friend = null; } }
  S.kids.forEach(k => { if (S.age - k.born > 20) k.bond -= 1; });
}
function crisisCheck(){
  if ((S.st.mood <= 3 || S.st.stress >= 97) && !S.flags.burnt){
    S.flags.burnt = true;
    getIll("憂鬱症");
    pending = {t:"你撐不下去了",d:"某個早上你坐在床邊，發現自己完全起不來。",
      c:[{l:"去看醫生，請長假",e:{mood:36,health:6,cash:-50,stress:-45},g:"",run:()=>{
            cureIll("憂鬱症"); badge("走出低潮");
            if (S.job && chance(0.5)){ S.job = null; logit("離開了那份工作。","bad"); }
          }},
         {l:"硬撐過去",e:{mood:16,health:-14,stress:-20},g:"你沒告訴任何人。"},
         {l:"回家住一陣子",e:{mood:30,cash:-10,social:4,stress:-38},g:"媽媽什麼都沒問，只是多煮了一道菜。",run:()=>cureIll("憂鬱症")}]};
    return true;
  }
  if (S.st.mood > 22 && S.st.stress < 85) S.flags.burnt = false;
  return false;
}
function deathCheck(){
  if (S.st.health <= 0){ die("身體先走一步，你撐到最後一刻。"); return true; }
  if (S.age < 45){
    if (S.gang > 0 && chance(0.004 * S.gang)){ die("在一場說不清楚的衝突裡，沒能走出來。"); return true; }
    if (chance(0.0006 * (1 + (50-S.st.luck)/120))){ die("一場意外，沒有任何預告。"); return true; }
    return false;
  }
  if (S.gang > 0 && chance(0.004 * S.gang)){ die("在一場說不清楚的衝突裡，沒能走出來。"); return true; }
  const base = Math.pow((S.age-44)/52, 3) * 0.5;
  const mod = 1 + (62 - S.st.health)/45 + (ill("慢性病") ? 0.25 : 0);
  if (chance(base * Math.max(0.3, mod))){
    die(S.age > 85 ? "在睡夢中離開，很安靜。" : "身體終究不聽話了。"); return true;
  }
  if (S.age >= 106){ die("活到一百零六歲，報紙來採訪過兩次。"); return true; }
  return false;
}
function safe(fn){ try { return !!fn(); } catch(e){ return false; } }
const W = e => typeof e.w === "function" ? e.w() : (e.w || 1);
function weighted(pool){
  const tot = pool.reduce((s,e)=>s+W(e),0); let r = Math.random()*tot;
  for (const e of pool){ r -= W(e); if (r<=0) return e; }
  return pool[0];
}
const REPEATABLE = {invest:1,scam:1,affair:1,bully:1,picky:1,ex:1,lotto:1,movecity:1,spouseJob:1,roommate:1,layoff:1,jump:1,
  confess:1,blind:1,office:1,netdate:1,kid:1,propose:1,meetfam:1,ldr:1,accident:1,kidart:1,kidleave:1,spouseIll:1,
  affair:1,exposed:1,loverpush:1,loverend:1,loanshark:1,collect:1,bankrupt:1,nightkeep:1,sugar:1,gangup:1,gangwash:1,afterjail:1,
  raid:1,nightpregF:1,nightpregM:1,nightlove:1,nightold:1,streamviral:1,streamstalk:1,streamout:1,
  comeout:1,pride:1,outwork:1,samekid:1,bidoubt:1,realize:1,
  harassWork:1,harassOut:1,nightharass:1,therapy:1,witness:1};

function advanceYear(){
  if (!S || !S.alive) return;
  S.age++;
  flashTick();
  yearlyFocus(); yearlyEconomy(); yearlyDrift();

  const m = milestone();
  if (m) pending = m;
  else if (!crisisCheck()){
    // 時代衝擊：一輩子最多碰上三次
    if (S.age >= 14 && (S.flags.eraCount||0) < 3 && chance(0.055)){
      const ep = ERA.filter(e => !S.seen["era_"+e.id] && safe(e.when));
      if (ep.length){
        const ev = weighted(ep);
        S.seen["era_"+ev.id] = true; S.flags.eraCount = (S.flags.eraCount||0)+1;
        pending = {t:ev.t, d:ev.d, c:ev.c};
      }
    }
    const dense = S.age <= 18 ? 0.46 : 0.42;      // 前十八年事件更密
    if (!pending && chance(dense)){
      const pool = CHOICE.filter(e => (!S.seen[e.id] || REPEATABLE[e.id]) && safe(e.when));
      if (pool.length){
        const ev = weighted(pool); S.seen[ev.id] = true;
        pending = {t:ev.t, d:ev.dyn ? ev.dyn() : ev.d, c:ev.c};
      }
    }
    if (!pending && chance(0.55)){
      const pool = AUTO.filter(e => safe(e.when));
      if (pool.length){
        const ev = weighted(pool);
        const txt = ev.dt ? ev.dt() : ev.t;
        applyEff(ev.e); if (ev.run) ev.run();
        logit(txt, ev.tone);
      }
    }
  }
  render();
  if (deathCheck()) return;
  if (pending) openEvent();
}

/* ===================== 結局 ===================== */
function die(reason){
  S.alive = false; S.deathReason = reason;
  speed = 0; syncSpeedBtns();
  logit("享年 "+S.age+" 歲。"+reason, "bad", true);
  showEnd();
}
function score(){
  const st = S.st;
  let v = st.health*0.8 + st.intel*0.9 + st.fit*0.6 + st.charm*0.6 + st.mood*1.8 + st.social*0.8;
  v -= st.stress * 0.6;
  v += Math.min(Math.max(S.money,0), 6000)/22;
  v += S.kids.length*22 + S.kids.reduce((s,k)=>s+k.bond*0.12,0);
  if (married()) v += 45;
  if (S.friend) v += 30;
  if (S.job) v += S.job.pres*9;
  v += DEG[S.degree]*12 + S.age*1.2 + Object.keys(S.badges).length*10;
  v -= S.exes*14 + S.conds.length*8 + (S.record?45:0) + (S.flags.bankrupt?30:0) + S.gang*18 + (S.flags.leaked?25:0);
  if (S.money < 0) v += S.money/18;
  return Math.max(0, Math.round(v));
}
function verdict(v){
  if (v > 920) return "一生難得";
  if (v > 780) return "活得很漂亮";
  if (v > 640) return "踏實的一生";
  if (v > 490) return "平凡但完整";
  if (v > 340) return "有點辛苦";
  return "來過，走過";
}
function epitaph(){
  const b = [];
  if (S.kids.length >= 3) b.push("子孫滿堂");
  if (S.money > 3000) b.push("留下不少錢");
  if (S.st.mood > 75) b.push("走的時候是笑的");
  if (S.st.stress > 70) b.push("一輩子沒真正放鬆過");
  if (S.exes >= 2) b.push("愛過很多次");
  if (S.friend) b.push("有人記得你小時候的樣子");
  if (!S.partner && !S.kids.length) b.push("一個人也走完了");
  if (S.st.health > 70) b.push("身體一直很好");
  if (S.badges["創業成功"]) b.push("自己當過老闆");
  if (S.age < 50) b.push("走得太早");
  if (S.lover) b.push("有一段沒人知道的事");
  if (S.badges["金盆洗手"]) b.push("後來收手了");
  if (S.badges["洗白了"]) b.push("最後走到了光裡");
  if (S.record) b.push("坐過牢");
  if (S.badges["上岸"]) b.push("靠自己上了岸");
  if (S.flags.leaked) b.push("有些東西一直還在網路上");
  if (S.badges["為了小孩離開"]) b.push("為了一個人收了手");
  if (S.badges["轉型成功"]) b.push("把過去換成了別的東西");
  if (S.badges["出櫃了"]) b.push("最後是以自己的樣子活著");
  if (S.badges["走出來了"]) b.push("花了很久，但走出來了");
  if (S.badges["說出來了"] || S.badges["我也是"]) b.push("曾經替自己說過話");
  if (S.flags.silent && ill("創傷壓力")) b.push("有些事到最後都沒說");
  if (S.flags.realized && S.orient !== "straight" && S.out === 0) b.push("有一句話一輩子沒說出口");
  if (S.flags.fakeMarry) b.push("那場婚姻維持到最後");
  if (S.badges["在八大待過"] && S.money > 500) b.push("用很辛苦的方式賺到錢");
  if (S.money < -100) b.push("債還沒還完");
  return b.length ? b.join("・") : "平平安安";
}
function showEnd(){
  const v = score(), bs = Object.keys(S.badges);
  $("endScreen").innerHTML =
    '<div class="kicker">AGE '+S.age+' · END</div>'+
    '<h2>'+S.name+'，'+verdict(v)+'</h2>'+
    '<p class="body">'+S.deathReason+'<br>'+epitaph()+'</p>'+
    '<div class="score">'+v+'</div>'+
    '<div class="grid">'+
      row("出身", S.origin.tag) + row("家鄉", S.place.name) +
      row("學歷", (S.uniTier?S.uniTier+"／":"")+S.degree) + row("最後職業", S.job ? S.job.t : (S.retired?"退休":"無")) +
      row(S.money<0?"負債":"資產", fmtMoney(Math.abs(S.money))) + row("子女", S.kids.length+" 人") +
      row("健康", Math.round(S.st.health)) + row("心情", Math.round(S.st.mood)) +
    '</div>'+
    (bs.length ? '<div class="badges">'+bs.map(b=>'<b>'+b+'</b>').join("")+'</div>' : '')+
    '<div class="choices"><button id="again">再活一次</button></div>'+
    (prevLives.length ? '<p class="body" style="margin-top:12px;font-size:11px;opacity:.6">前幾輩子：'+prevLives.map(p=>p.name+" "+p.age+"歲／"+p.score+"分").join("，")+'</p>' : '');
  $("endScreen").classList.add("on");
  $("again").onclick = resetAll;
  saveLife(v);
  $("tapeSub").textContent = S.name+"．"+S.age+" 歲．"+verdict(v)+" "+v+" 分";
}
const row = (k,v) => '<span>'+k+'<em>'+v+'</em></span>';

/* ===================== 存檔 ===================== */
let heavyOn = true;
const heavy = () => heavyOn;
function syncHeavy(){
  $("btnHeavy").innerHTML = "沉重劇情：" + (heavyOn ? "開" : "關") +
    '<small>性騷擾、性侵與創傷相關的情節</small>';
  try { localStorage.setItem("lifemachine.heavy", heavyOn ? "1" : "0"); } catch(e){}
}
let prevLives = [];
function loadHeavy(){
  try { const v = localStorage.getItem("lifemachine.heavy"); if (v !== null) heavyOn = v === "1"; } catch(e){}
}
function loadLives(){
  try { const r = JSON.parse(localStorage.getItem("lifemachine.lives") || "[]"); prevLives = Array.isArray(r) ? r : []; }
  catch(e){ prevLives = []; }
}
function saveLife(v){
  try {
    prevLives.unshift({name:S.name, age:S.age, score:v});
    prevLives = prevLives.slice(0,4);
    localStorage.setItem("lifemachine.lives", JSON.stringify(prevLives));
  } catch(e){}
}

/* ===================== 畫面 ===================== */
let lastSprite = "", lastScene = "", lastFit = "", blink = false, step = false;
function paintSprite(){
  $("sprite").innerHTML = spriteSVG(lastSprite || "baby", blink, step);
}
function flashTick(){
  const sc = $("screen"), el = $("age");
  sc.classList.add("tick"); setTimeout(()=>sc.classList.remove("tick"), 120);
  el.classList.add("pop"); setTimeout(()=>el.classList.remove("pop"), 190);
}
function render(){
  if (!S) return;
  $("age").textContent = S.age;
  $("stageName").textContent = STAGE_INFO[stageKey()].n + (S.job ? "／"+S.job.t : "");
  $("cash").textContent = (S.money < 0 ? "-" : "") + "$" + fmtMoney(Math.abs(S.money));

  const sp = spriteKey(), of = outfitKey() + "|" + (S.age>=68?2:S.age>=50?1:0);
  if (sp !== lastSprite || of !== lastFit){ lastSprite = sp; lastFit = of; paintSprite(); }
  const sk = stageKey();
  if (sk !== lastScene){ lastScene = sk; drawScene(sk); }

  $("bars").innerHTML = STAT_DEF.map(d => {
    const v = Math.round(S.st[d.k]);
    const warn = d.bad ? v > 72 : v < 25;
    return '<div class="bar'+(warn?' warn':'')+'"><span>'+d.n+'<em>'+v+'</em></span><i><b style="width:'+v+'%;background:'+d.c+'"></b></i></div>';
  }).join("");

  $("chips").innerHTML =
    S.traits.map(t=>'<b>'+t+'</b>').join("") +
    (S.flags.realized && S.orient !== "straight"
      ? '<b style="border-color:#C49BEC;color:#C49BEC">'+(S.orient==="gay"?"同性戀":"雙性戀")+
        (S.out===2?"・已出櫃":S.out===1?"・只跟朋友說":"・還沒說")+'</b>' : "") +
    S.conds.map(c=>'<b class="ill">'+c+'</b>').join("") +
    (S.record ? '<b class="ill">前科</b>' : "") +
    (S.flags.bankrupt ? '<b class="ill">破產紀錄</b>' : "") +
    (S.flags.night ? '<b class="ill">'+(S.flags.stream?'開過台':'待過八大')+'</b>' : "") +
    (S.flags.leaked ? '<b class="ill">影片外流</b>' : "");

  const fam = [];
  if (S.partner) fam.push('<b>'+(S.partner.married?"配偶":"交往")+'</b> '+S.partner.name+
    (sameSex()?'<span style="opacity:.6">（同性）</span>':'')+' '+Math.round(S.partner.aff)+'%');
  if (S.kids.length) fam.push('<b>子女</b> '+S.kids.map(k=>k.name+"("+(S.age-k.born)+")").join("、"));
  if (S.friend) fam.push('<b>摯友</b> '+S.friend.name);
  if (S.house) fam.push('<b>房</b> '+S.house);
  if (S.lover) fam.push('<b style="color:#F0909F">外遇</b> '+S.lover.name+' 風險'+Math.round(Math.min(100,S.lover.risk))+'%');
  if (S.debtKind) fam.push('<b style="color:#F0909F">'+S.debtKind+'</b> 欠 '+fmtMoney(-S.money));
  if (S.gang > 0) fam.push('<b style="color:#F0909F">道上</b> '+["","小弟","角頭","大哥"][S.gang]);
  if (S.jail > 0) fam.push('<b style="color:#F0909F">服刑</b> 還有 '+S.jail+' 年');
  $("family").innerHTML = fam.join("　") || '<span style="opacity:.4">'+S.place.name+'・'+S.home.name+'</span>';

  renderFocus(); renderTicker();
}
function renderTicker(){
  $("ticker").innerHTML = S.log.slice(-3).map(l => '<p><u>'+l.age+'</u>'+l.text+'</p>').join("") || '<p>故事還沒開始。</p>';
}
function renderTape(){
  const list = $("tapeList");
  list.innerHTML = S.log.map(l => '<div class="'+(l.tone||"")+(l.key?" key":"")+'"><u>'+l.age+'</u><span>'+l.text+'</span></div>').join("");
  list.scrollTop = list.scrollHeight;
  $("tapeSub").textContent = S.name + "　" + S.origin.tag + "　" + S.age + " 歲";
}
function renderFocus(){
  const set = FOCUS_SETS[stageKey()] || FOCUS_SETS.work;
  if (set.indexOf(S.focus) < 0) S.focus = set[0];
  $("focusGrid").innerHTML = set.map(f =>
    '<button class="focus-btn" data-f="'+f+'" aria-pressed="'+(S.focus===f)+'">'+f+'</button>').join("");
  Array.prototype.forEach.call($("focusGrid").children, b => {
    b.onclick = () => { S.focus = b.dataset.f; renderFocus(); };
  });
}

/* ===================== 事件視窗 ===================== */
function openEvent(){
  const ev = pending; if (!ev) return;
  $("evAge").textContent = "AGE " + S.age;
  $("evTitle").textContent = ev.t;
  $("evText").textContent = ev.d || "";
  const box = $("evChoices"); box.innerHTML = "";
  ev.c.forEach(ch => {
    const b = document.createElement("button");
    const label = typeof ch.l === "function" ? ch.l() : ch.l;
    b.innerHTML = label + (ch.g ? '<small>'+ch.g+'</small>' : '');
    b.onclick = () => {
      $("event").classList.remove("on");
      pending = null;
      applyEff(ch.e);
      if (ch.g) logit(ch.g, null);
      if (ch.run) ch.run();
      render();
      if (pending){ openEvent(); return; }
      if (deathCheck()) return;
      renderTape();
    };
    box.appendChild(b);
  });
  $("event").classList.add("on");
}

/* ===================== 時間與動畫迴圈 ===================== */
const YEAR_MS = 2600;
let speed = 1, acc = 0, lastT = 0, running = false, animT = 0, blinkAt = 2200;
function modalOpen(){
  return $("event").classList.contains("on") || $("startScreen").classList.contains("on") || $("endScreen").classList.contains("on");
}
function frame(t){
  if (!lastT) lastT = t;
  const dt = Math.min(t - lastT, 200); lastT = t;

  if (running && speed > 0 && !modalOpen() && S && S.alive){
    acc += dt * speed;
    if (acc >= YEAR_MS){ acc = 0; advanceYear(); }
  }
  $("yearbar").style.width = (running && S && S.alive ? Math.min(acc/YEAR_MS,1)*100 : 0) + "%";

  // 眨眼與踏步
  if (S){
    animT += dt;
    let dirty = false;
    const wantStep = running && speed > 0 && !modalOpen() && Math.floor(animT/460) % 2 === 1;
    if (wantStep !== step){ step = wantStep; dirty = true; }
    if (animT > blinkAt && !blink){ blink = true; dirty = true; }
    if (blink && animT > blinkAt + 130){ blink = false; animT = 0; blinkAt = 1800 + Math.random()*3200; dirty = true; }
    if (dirty) paintSprite();
  }
  requestAnimationFrame(frame);
}
function syncSpeedBtns(){
  [[0,"sp0"],[1,"sp1"],[2,"sp2"],[4,"sp4"]].forEach(p => $(p[1]).setAttribute("aria-pressed", speed === p[0]));
  $("speedLabel").textContent = speed === 0 ? "已暫停" : "一年約 " + (YEAR_MS/1000/speed).toFixed(1) + " 秒";
}
[[0,"sp0"],[1,"sp1"],[2,"sp2"],[4,"sp4"]].forEach(p => {
  $(p[1]).onclick = () => { speed = p[0]; acc = 0; syncSpeedBtns(); };
});
$("stepBtn").onclick = () => { if (S && S.alive && !modalOpen()){ acc = 0; advanceYear(); } };

/* ===================== 投胎 ===================== */
function rollBirth(){
  const sex = chance(.5) ? "M" : "F";
  const t = TRAITS.slice();
  const t1 = t.splice(Math.floor(Math.random()*t.length),1)[0];
  const t2 = t.splice(Math.floor(Math.random()*t.length),1)[0];
  draft = {origin:wpick(ORIGINS), place:wpick(PLACES), home:wpick(HOMES), traits:[t1,t2], sex:sex,
           name:makeName(sex), skin:pick(SKINS), hair:pick(HAIRS),
           orient:wpick([{v:"straight",w:84},{v:"gay",w:7},{v:"bi",w:9}]).v};
  $("birthTitle").textContent = draft.name + "・" + draft.place.name;
  $("birthText").innerHTML =
    draft.origin.desc + "<br>" +
    "<b>" + draft.home.name + "</b>（" + (sex==="M"?"男":"女") + "）<br>" +
    "天生：<b>" + t1.n + "</b>（" + t1.d + "）、<b>" + t2.n + "</b>（" + t2.d + "）";
  $("rerollLeft").textContent = rerolls > 0 ? "還可以換 " + rerolls + " 次" : "沒得換了，認命吧";
  const save = S; S = {sex:draft.sex, age:8, skin:draft.skin, hair:draft.hair,
                       retired:false, jail:0, gang:0, job:null, path:null, flags:{}};
  drawScene("primary"); $("sprite").innerHTML = spriteSVG(draft.sex==="F"?"childF":"childM", false, false);
  S = save;
}
$("btnReroll").onclick = () => { if (rerolls > 0){ rerolls--; rollBirth(); } };
$("btnStart").onclick = () => {
  S = newState(draft);
  S.focus = "餵養照顧";
  lastSprite = ""; lastScene = ""; lastFit = "";
  logit(S.name+"出生在"+S.place.name+"。"+S.origin.desc, null, true);
  logit("家裡的情況是："+S.home.name+"。", null);
  $("startScreen").classList.remove("on");
  running = true; speed = 1; acc = 0; syncSpeedBtns();
  render(); renderTape();
};
function resetAll(){
  $("endScreen").classList.remove("on");
  $("event").classList.remove("on");
  rerolls = 3; S = null; pending = null; running = false;
  lastSprite = ""; lastScene = ""; lastFit = "";
  $("tapeList").innerHTML = '<div class="tape-empty">這台機器會把每一年印出來。</div>';
  $("tapeSub").textContent = "尚未出生";
  rollBirth();
  $("startScreen").classList.add("on");
}

loadHeavy(); syncHeavy(); loadLives(); syncSpeedBtns(); rollBirth();
$("btnHeavy").onclick = () => { heavyOn = !heavyOn; syncHeavy(); };
requestAnimationFrame(frame);
})();
</script>
