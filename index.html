<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生機 — 一個人的一輩子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --page:#E6E1D6;
  --page2:#D8D2C4;
  --ink:#2B2822;
  --ink-soft:#6B6457;
  --shell:#C3B6D8;
  --shell-hi:#D6CCE6;
  --shell-lo:#9C8EB6;
  --shell-ink:#4A3F5C;
  --btn:#F2ECE0;
  --btn-lo:#CFC6B4;
  --accent:#E8405F;
  --accent-lo:#B32A44;
  --lcd:#4A5B33;
  --lcd-dim:#5E7044;
  --lcd-glow:#C8DC6E;
  --lcd-mid:#93A850;
  --tape:#FBF6E9;
  --tape-ink:#4A4336;
  --tape-line:#DED5BF;
  --shadow:rgba(60,50,40,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#17181B;
    --page2:#202126;
    --ink:#E8E4DB;
    --ink-soft:#9A948A;
    --shell:#8E82A6;
    --shell-hi:#A79BBE;
    --shell-lo:#5F5574;
    --shell-ink:#1E1926;
    --btn:#CFC8BC;
    --btn-lo:#8D8778;
    --tape:#E6DFCE;
    --tape-ink:#433D31;
    --tape-line:#CDC3AC;
    --shadow:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#17181B; --page2:#202126; --ink:#E8E4DB; --ink-soft:#9A948A;
  --shell:#8E82A6; --shell-hi:#A79BBE; --shell-lo:#5F5574; --shell-ink:#1E1926;
  --btn:#CFC8BC; --btn-lo:#8D8778; --tape:#E6DFCE; --tape-ink:#433D31;
  --tape-line:#CDC3AC; --shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  background-image:radial-gradient(circle at 50% 0%,var(--page2),var(--page) 70%);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  min-height:100%;
  padding:20px 14px 48px;
}
.wrap{max-width:1040px;margin:0 auto;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;justify-content:center}

/* ---------- 機身 ---------- */
.machine{
  flex:1 1 420px;max-width:520px;min-width:300px;
  background:linear-gradient(170deg,var(--shell-hi),var(--shell) 45%,var(--shell-lo));
  border-radius:38px 38px 46px 46px;
  padding:16px 16px 20px;
  box-shadow:0 18px 40px -12px var(--shadow),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -6px 14px rgba(0,0,0,.18);
  position:relative;
}
.brand{display:flex;align-items:center;justify-content:space-between;padding:2px 10px 12px;color:var(--shell-ink)}
.brand .dots{display:flex;gap:6px}
.brand .dots i{width:7px;height:7px;border-radius:50%;background:var(--shell-lo);box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.brand h1{margin:0;font-size:15px;font-weight:900;letter-spacing:.14em}
.brand small{font-family:VT323,monospace;font-size:17px;opacity:.65;letter-spacing:.05em}

/* ---------- 螢幕 ---------- */
.screen{
  background:var(--lcd);
  border-radius:16px;
  padding:12px 13px 10px;
  position:relative;overflow:hidden;
  box-shadow:inset 0 3px 14px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.4);
  color:var(--lcd-glow);
  min-height:330px;
  display:flex;flex-direction:column;
}
.screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);
}
.hud{display:flex;justify-content:space-between;align-items:baseline;font-family:VT323,monospace;font-size:22px;line-height:1}
.hud .age b{font-size:34px;font-weight:400}
.hud .who{font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.8}
.hud .cash{color:#fff;text-shadow:0 0 8px rgba(200,220,110,.5)}
.yearbar{height:3px;background:rgba(0,0,0,.3);border-radius:2px;margin:7px 0 4px;overflow:hidden}
.yearbar i{display:block;height:100%;width:0;background:var(--lcd-glow);opacity:.75}

.scene{flex:1;display:flex;gap:12px;align-items:center;min-height:120px}
.sprite{width:112px;flex:0 0 112px;animation:bob 2.6s ease-in-out infinite}
.sprite svg{width:100%;display:block;filter:drop-shadow(0 0 6px rgba(200,220,110,.25))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.sprite{animation:none}}

.bars{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;min-width:0}
.bar{font-size:10.5px;font-weight:700;letter-spacing:.06em}
.bar span{display:flex;justify-content:space-between;opacity:.85;margin-bottom:2px}
.bar span em{font-style:normal;font-family:VT323,monospace;font-size:14px}
.bar i{display:block;height:6px;background:rgba(0,0,0,.32);border-radius:1px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--lcd-glow);transition:width .45s ease}
.bar.low i b{background:var(--accent)}

.ticker{
  border-top:1px dashed rgba(200,220,110,.3);margin-top:8px;padding-top:7px;
  font-size:12px;line-height:1.55;min-height:58px;
}
.ticker p{margin:0 0 2px;opacity:.55}
.ticker p:last-child{opacity:1;font-weight:500}
.ticker p u{text-decoration:none;font-family:VT323,monospace;font-size:15px;margin-right:6px;opacity:.7}

.family{display:flex;gap:4px;align-items:center;font-size:11px;margin-top:6px;opacity:.85;flex-wrap:wrap;min-height:16px}
.family b{font-weight:700}

/* ---------- 覆蓋層（事件／開始／結束） ---------- */
.overlay{
  position:absolute;inset:0;background:var(--lcd);z-index:5;
  padding:16px 16px;display:none;flex-direction:column;justify-content:center;
  animation:pop .22s ease-out;
}
.overlay.on{display:flex}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.overlay{animation:none}}
.overlay h2{margin:0 0 8px;font-size:17px;font-weight:900;letter-spacing:.04em}
.overlay .kicker{font-family:VT323,monospace;font-size:16px;opacity:.6;letter-spacing:.1em;margin-bottom:2px}
.overlay p.body{margin:0 0 14px;font-size:13px;line-height:1.7;opacity:.9}
.choices{display:flex;flex-direction:column;gap:7px}
.choices button{
  text-align:left;font:inherit;font-size:13px;font-weight:500;cursor:pointer;
  background:rgba(200,220,110,.1);color:var(--lcd-glow);
  border:1px solid rgba(200,220,110,.45);border-radius:8px;padding:9px 11px;
  transition:background .14s,transform .14s;
}
.choices button:hover{background:rgba(200,220,110,.24)}
.choices button:active{transform:translateY(1px)}
.choices button small{display:block;opacity:.6;font-size:11px;margin-top:2px;font-weight:400}
.choices button:focus-visible,.ctrl:focus-visible,.focus-btn:focus-visible,.tape-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 控制區 ---------- */
.controls{padding:14px 4px 0}
.row-speed{display:flex;gap:8px;align-items:center;margin-bottom:13px}
.ctrl{
  width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(180deg,var(--btn),var(--btn-lo));
  box-shadow:0 3px 0 var(--shell-lo),0 5px 8px rgba(0,0,0,.2);
  color:var(--shell-ink);font-size:15px;font-weight:700;font-family:VT323,monospace;
  display:grid;place-items:center;transition:transform .08s,box-shadow .08s;
}
.ctrl:active{transform:translateY(3px);box-shadow:0 0 0 var(--shell-lo)}
.ctrl[aria-pressed="true"]{background:linear-gradient(180deg,var(--accent),var(--accent-lo));color:#fff}
.ctrl.wide{width:auto;padding:0 14px;border-radius:21px;font-family:"Noto Sans TC",sans-serif;font-size:12px}
.speed-label{margin-left:auto;font-size:11px;color:var(--shell-ink);font-weight:700;letter-spacing:.06em;opacity:.8}

.focus-title{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--shell-ink);opacity:.75;margin:0 0 7px 2px}
.focus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.focus-btn{
  font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:10px 4px;
  border-radius:11px;border:1.5px solid transparent;
  background:linear-gradient(180deg,var(--btn),var(--btn-lo));color:var(--shell-ink);
  box-shadow:0 2px 0 var(--shell-lo);transition:transform .08s,box-shadow .08s;
}
.focus-btn:active{transform:translateY(2px);box-shadow:none}
.focus-btn[aria-pressed="true"]{
  background:linear-gradient(180deg,var(--accent),var(--accent-lo));color:#fff;
  box-shadow:0 2px 0 var(--accent-lo),0 0 0 3px rgba(232,64,95,.22);
}

/* ---------- 紙帶 ---------- */
.tape{
  flex:1 1 300px;max-width:360px;min-width:260px;
  background:var(--tape);color:var(--tape-ink);
  border-radius:3px;padding:18px 18px 0;
  box-shadow:0 14px 30px -14px var(--shadow);
  position:relative;
  font-size:12.5px;line-height:1.6;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);
}
.tape::before{
  content:"";position:absolute;left:0;right:0;top:0;height:7px;
  background:repeating-linear-gradient(90deg,var(--page) 0 7px,transparent 7px 14px);
}
.tape h3{margin:8px 0 2px;font-size:12px;font-weight:900;letter-spacing:.18em}
.tape .sub{margin:0 0 12px;font-size:11px;opacity:.6;border-bottom:1px dashed var(--tape-line);padding-bottom:10px}
.tape-list{max-height:430px;overflow:auto;padding-bottom:26px;scrollbar-width:thin}
.tape-list div{display:flex;gap:9px;padding:3px 0;border-bottom:1px dotted var(--tape-line)}
.tape-list div u{text-decoration:none;font-family:VT323,monospace;font-size:15px;opacity:.55;flex:0 0 26px;text-align:right}
.tape-list div.good u{color:#3E7A3E;opacity:1}
.tape-list div.bad u{color:var(--accent-lo);opacity:1}
.tape-list div.key{font-weight:700}
.tape-empty{opacity:.5;padding:12px 0}

/* ---------- 結束畫面 ---------- */
.result .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;margin:10px 0 12px}
.result .grid span{display:flex;justify-content:space-between;border-bottom:1px dotted rgba(200,220,110,.25);padding:2px 0}
.result .grid span em{font-style:normal;font-family:VT323,monospace;font-size:16px}
.result .score{font-family:VT323,monospace;font-size:44px;line-height:.9;color:#fff}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.badges b{font-size:10.5px;font-weight:700;border:1px solid rgba(200,220,110,.5);border-radius:20px;padding:2px 8px}
.tape-btn{
  font:inherit;font-size:12px;font-weight:700;cursor:pointer;margin:10px 0 18px;
  background:var(--accent);color:#fff;border:none;border-radius:20px;padding:9px 16px;
}
.hint{font-size:11px;color:var(--ink-soft);text-align:center;width:100%;margin:4px 0 0;line-height:1.7}
.scroll-in{overflow:auto;max-height:100%}
@media (max-width:720px){
  .wrap{gap:16px}
  .machine{max-width:100%}
  .tape{max-width:100%}
  .tape-list{max-height:260px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 機身 -->
  <div class="machine">
    <div class="brand">
      <div class="dots"><i></i><i></i></div>
      <h1>人生機</h1>
      <small>LIFE-84</small>
    </div>

    <div class="screen" id="screen">
      <div class="hud">
        <div class="age"><b id="age">0</b> 歲 <span class="who" id="stageName">出生</span></div>
        <div class="cash" id="cash">$0</div>
      </div>
      <div class="yearbar"><i id="yearbar"></i></div>

      <div class="scene">
        <div class="sprite" id="sprite"></div>
        <div class="bars" id="bars"></div>
      </div>

      <div class="family" id="family"></div>

      <div class="ticker" id="ticker"></div>

      <!-- 事件覆蓋層 -->
      <div class="overlay" id="event">
        <div class="kicker" id="evAge">AGE 00</div>
        <h2 id="evTitle"></h2>
        <p class="body" id="evText"></p>
        <div class="choices" id="evChoices"></div>
      </div>

      <!-- 開場 -->
      <div class="overlay on scroll-in" id="startScreen">
        <div class="kicker">NEW LIFE</div>
        <h2 id="birthTitle">投胎中…</h2>
        <p class="body" id="birthText">按下開始，隨機誕生成一個人。</p>
        <div class="choices">
          <button id="btnStart">開始這一生</button>
          <button id="btnReroll">重新投胎 <small id="rerollLeft">還可以換 3 次</small></button>
        </div>
      </div>

      <!-- 結局 -->
      <div class="overlay result scroll-in" id="endScreen"></div>
    </div>

    <div class="controls">
      <div class="row-speed">
        <button class="ctrl" id="sp0" aria-pressed="false" title="暫停">❙❙</button>
        <button class="ctrl" id="sp1" aria-pressed="true" title="正常速度">▶</button>
        <button class="ctrl" id="sp2" aria-pressed="false" title="兩倍速">▶▶</button>
        <button class="ctrl" id="sp4" aria-pressed="false" title="四倍速">▶▶▶</button>
        <button class="ctrl wide" id="stepBtn" title="手動過一年">過一年</button>
        <span class="speed-label" id="speedLabel">一年約 2.6 秒</span>
      </div>
      <p class="focus-title">這幾年的重心</p>
      <div class="focus-grid" id="focusGrid"></div>
    </div>
  </div>

  <!-- 紙帶 -->
  <div class="tape">
    <h3>人生紀事</h3>
    <p class="sub" id="tapeSub">尚未出生</p>
    <div class="tape-list" id="tapeList"><div class="tape-empty">這台機器會把每一年印出來。</div></div>
  </div>

  <p class="hint">選一個重心，時間就會自己往前走。心情歸零會出事，健康歸零會沒命。</p>
</div>

<script>
(function(){
"use strict";

/* ===================== 像素小人 ===================== */
const SPR = {
baby:[
"................","................","....########....","...##########...",
"...##.####.##...","...##########...","...###o..o###...","....########....",
".....o####o.....","...############.","..#.##########.#","..#.##########.#",
"..#.##########.#","...############.","....##....##....","....##....##...."],
child:[
"................","....########....","...##########...","...##########...",
"...##.####.##...","...##########...","....###..###....","....########....",
".....o####o.....","...############.","..#.##..####.#..","..#.##..####.#..",
"...############.",".....##..##.....",".....##..##.....","....###..###...."],
teen:[
"................","...#########....","..###########...","..###########...",
"...##.####.##...","...##########...","....###..###....","....########....",
".....o####o.....","..##############","..#.##########.#","..#.##########.#",
"....##########..",".....##..##.....",".....##..##.....","....###..###...."],
adult:[
"................","....########....","...##########...","...##.####.##...",
"...##########...","....###..###....","....########....",".....o####o.....",
"..##############","..###..##..#####","..###..##..#####","..###.####.#####",
"....##########..",".....##..##.....",".....##..##.....","....###..###...."],
mid:[
"................","....########....","...##########...","...##.####.##...",
"...##########...","....##o..o##....","....########....",".....o####o.....",
".##############.",".###..####..####",".##############.",".##############.",
"..############..",".....##..##.....",".....##..##.....","....###..###...."],
elder:[
"................","...oooooooo.....","...##########...","...##.####.##...",
"...##########...","....##o..o##....","....########....","....o######o....",
"...##########.#.","..############.#","..############.#","...##########..#",
"....##....##...#","....##....##...#","...###....###..#","...............#"]
};
function spriteSVG(key){
  const g = SPR[key] || SPR.adult; let r = "";
  for (let y=0;y<g.length;y++) for (let x=0;x<g[y].length;x++){
    const c = g[y][x];
    if (c === "#") r += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="currentColor"/>';
    else if (c === "o") r += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="currentColor" opacity=".45"/>';
  }
  return '<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
}

/* ===================== 名字 ===================== */
const SUR = "陳林黃張李王吳劉蔡楊許鄭謝郭洪曾邱廖賴徐周葉蘇莊呂江何蕭羅高".split("");
const GIV_M = ["家豪","志明","宗翰","俊傑","建宏","冠廷","彥廷","柏翰","承恩","子軒","泓瑜","明翰","又嘉","哲宇"];
const GIV_F = ["淑芬","雅婷","怡君","佩珊","欣怡","詩涵","宜蓁","曉彤","品妍","芷晴","惠敏","郁婷","心妤","映竹"];
const pick = a => a[Math.floor(Math.random()*a.length)];
const rnd = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
function makeName(sex){ return pick(SUR) + pick(sex==="M"?GIV_M:GIV_F); }

/* ===================== 出身 ===================== */
const ORIGINS = [
  {k:"富",name:"含金湯匙",desc:"家裡在信義區有兩間房，爸媽的期待比房價還高。",money:600,w:8,
   stats:{intel:8,charm:10,health:5},tag:"家境優渥"},
  {k:"中",name:"標準小康",desc:"公教家庭，爸媽恩愛，晚餐七點準時開飯。",money:120,w:34,
   stats:{mood:8,health:5},tag:"小康家庭"},
  {k:"工",name:"工人家庭",desc:"爸爸跑工地，媽媽做早餐店，從小就很會看人臉色。",money:30,w:28,
   stats:{fit:10,charm:5},tag:"刻苦出身"},
  {k:"貧",name:"隔代教養",desc:"阿嬤帶大的孩子，廟口長大，有點野。",money:5,w:16,
   stats:{fit:12,mood:-5,intel:-5},tag:"阿嬤帶大"},
  {k:"書",name:"書香門第",desc:"家裡牆壁都是書，電視只能看公視。",money:200,w:14,
   stats:{intel:15,charm:-5,fit:-5},tag:"書香門第"}
];
function rollOrigin(){
  const tot = ORIGINS.reduce((s,o)=>s+o.w,0); let r = Math.random()*tot;
  for (const o of ORIGINS){ r -= o.w; if (r<=0) return o; }
  return ORIGINS[1];
}

/* ===================== 狀態 ===================== */
const STAT_DEF = [
  {k:"health",n:"健康"},{k:"intel",n:"智力"},
  {k:"fit",n:"體能"},{k:"charm",n:"魅力"},
  {k:"mood",n:"心情"},{k:"social",n:"人緣"}
];
let S = null, draft = null, rerolls = 3;

function newState(origin, name, sex){
  const st = {health:70,intel:50,fit:50,charm:50,mood:70,social:50};
  for (const k in origin.stats) st[k] += origin.stats[k];
  return {
    name:name, sex:sex, origin:origin, age:0, alive:true,
    st:st, money:origin.money,
    focus:null, path:null, major:null, school:"一般", degree:"無",
    job:null, retired:false, house:null,
    partner:null, kids:[], exes:0,
    log:[], badges:{}, flags:{}, seen:{},
    debtYears:0
  };
}
function clamp(v){ return Math.max(0, Math.min(100, v)); }
function add(k, v){ S.st[k] = clamp(S.st[k] + v); }
function money(v){ S.money += v; }
function fmtMoney(m){
  const v = Math.round(m);
  if (Math.abs(v) >= 10000) return (v/10000).toFixed(2).replace(/\.?0+$/,"") + " 億";
  return v + " 萬";
}
function badge(t){ S.badges[t] = true; }

/* ===================== 階段 ===================== */
function stageKey(){
  const a = S.age;
  if (S.retired) return "retire";
  if (a < 3) return "baby";
  if (a < 6) return "toddler";
  if (a < 12) return "primary";
  if (a < 15) return "junior";
  if (a < 18) return "senior";
  if (S.path === "uni" && a < 22) return "uni";
  if (S.path === "grad" && a < 25) return "grad";
  if (S.path === "abroad" && a < 24) return "abroad";
  if (a < 18) return "senior";
  return "work";
}

const DEG_RANK = {"無":0,"高中":1,"大學":2,"碩士":3,"博士":4};
function jobOK(j){
  const n = j.need;
  if (n.degree && DEG_RANK[S.degree] < DEG_RANK[n.degree]) return false;
  if (n.intel && S.st.intel < n.intel) return false;
  if (n.fit && S.st.fit < n.fit) return false;
  if (n.charm && S.st.charm < n.charm) return false;
  if (n.major && S.major !== n.major) return false;
  return true;
}
function jobOptions(k){
  const ok = JOBS.filter(jobOK).sort((a,b)=>b.pay-a.pay);
  const out = ok.slice(0, k);
  if (out.length < 2) out.push(JOBS[0]);
  return out;
}
function takeJob(j){
  S.job = {t:j.t, pay:j.pay, pres:j.pres, years:0};
  if (j.pres >= 5) badge("人生勝利組");
}

/* ===================== 里程碑 ===================== */
function milestone(){
  const a = S.age;
  if (a===1) { logit("你會走路了，第一步就撲進沙發。","good"); return null; }
  if (a===3) return {
    t:"要上幼兒園了", d:"家附近有三種選擇，媽媽在聯絡簿上寫了好久。",
    c:[{l:"公立幼兒園", e:{mood:5,social:5}, g:"同學很多，老師很兇但很好。"},
       {l:"雙語私立", e:{intel:10,charm:5,mood:-4,cash:-80}, g:"你三歲就會說 apple。", run:()=>{badge("雙語寶寶");}},
       {l:"阿嬤顧就好", e:{mood:8,health:4,intel:-5,cash:15}, g:"每天跟阿嬤去市場。"}]};
  if (a===6) { logit("背起書包上小學，書包比你還重。",null,true); return null; }
  if (a===12){ logit("升上國中，制服永遠大一號。",null,true); return null; }
  if (a===15) return exam15();
  if (a===18) return exam18();
  if (a===22 && S.path==="uni") return afterUni();
  if (a===24 && (S.path==="grad"||S.path==="abroad")) return afterGrad();
  if (a>=18 && stageKey()==="work" && !S.job && !S.retired) return findJob();
  return null;
}
function exam15(){
  const sc = S.st.intel + rnd(-12,12);
  let school, eff;
  if (sc>78){ school="第一志願"; eff={mood:14,social:5}; }
  else if (sc>58){ school="社區高中"; eff={mood:5}; }
  else { school="高職"; eff={mood:-3,fit:4}; S.flags.voc=true; }
  S.school = school;
  return {t:"會考成績出來了", d:"你的分數落在 "+school+"。全家圍著電腦看榜單。",
    c:[{l:"接受，去念 "+school, e:eff, g:"新制服比舊制服好看一點。"}]};
}
function exam18(){
  S.degree = "高中";
  const sc = S.st.intel + (S.school==="第一志願"?10:0) + rnd(-10,10);

/* ===================== 年度推進 ===================== */
let pending = null;

function applyEff(e){
  if (!e) return;
  for (const k in e){
    if (k === "cash") money(e[k]); else if (S.st[k] !== undefined) add(k, e[k]);
  }
}
function yearlyFocus(){
  const f = S.focus; if (!f || !FOCUS[f]) return;
  const e = FOCUS[f];
  for (const k in e){ if (k==="cash") money(e[k]); else add(k, e[k]); }
  if (f === "打工賺錢" || f === "拼事業" || f === "摸魚度日") { /* 收入另計 */ }
  if (f === "投資理財" && S.money > 0){
    const r = rnd(-0.21, 0.26) + (S.st.intel-50)/900;
    money(S.money * r);
  }
  if (f === "談戀愛" || f === "偷偷戀愛" || f === "陪伴家人"){
    if (S.partner) S.partner.aff = Math.min(100, S.partner.aff + 9);
    S.kids.forEach(k => k.bond = Math.min(100, k.bond + 8));
  }
  if (f === "含飴弄孫") S.kids.forEach(k => k.bond = Math.min(100, k.bond + 5));
}
function yearlyEconomy(){
  const k = stageKey();
  if (k === "work" && S.job){
    let mul = S.focus === "拼事業" ? 1.25 : S.focus === "摸魚度日" ? 0.95 : 1;
    money(S.job.pay * mul);
    S.job.years++;
    const pr = (S.focus === "拼事業" ? 0.30 : 0.12) + (S.st.intel+S.st.social)/900;
    if (S.job.years >= 3 && Math.random() < pr){
      S.job.pay = Math.round(S.job.pay * rnd(1.08, 1.22));
      S.job.years = 1; logit("升職加薪，年薪變 "+S.job.pay+" 萬。","good");
    }
    if (S.focus === "摸魚度日" && Math.random() < 0.07){
      logit("被委婉地請走了。","bad",true); S.job = null;
    }
  }
  if (k === "retire") money(rnd(18, 32));
  // 生活開銷
  let cost = 0;
  if (S.age >= 18) cost += 26;
  cost += S.kids.filter(kd => S.age - kd.born < 24).length * 16;
  if (S.flags.loan > 0){ cost += 42; S.flags.loan--; if (S.flags.loan===0) logit("房貸終於繳完了。","good",true); }
  money(-cost);
  if (S.money < 0){
    S.debtYears++; add("mood", -6);
    if (S.debtYears === 3) logit("帳單堆成一疊，你開始算哪一張可以晚點繳。","bad");
  } else S.debtYears = 0;
}
function yearlyDrift(){
  const a = S.age;
  if (a > 35) add("health", -((a-35)/22));
  if (a > 58) add("fit", -1);
  // 體能會往久坐的基準線回歸：不練會掉，練太兇也有天花板
  S.st.fit = clamp(S.st.fit + (34 - S.st.fit) * 0.08);
  if (S.st.fit < 35) add("health", -0.8);
  if (S.st.fit > 70) add("health", 0.8);
  // 年輕的身體會自己修回來
  if (a < 45 && S.st.health < 72) add("health", 2.4);
  else if (a < 62 && S.st.health < 50) add("health", 1.2);
  // 心情回歸
  S.st.mood += (58 - S.st.mood) * 0.07;
  if (S.st.health < 35) add("mood", -3);
  if (S.money < 0) add("mood", -2);
  // 感情自然衰退
  if (S.partner){
    const f = S.focus;
    if (f !== "陪伴家人" && f !== "談戀愛" && f !== "偷偷戀愛") S.partner.aff -= rnd(1.5, 4);
    if (S.partner.married && S.partner.aff < 15 && Math.random() < 0.45) divorce(false);
    else if (!S.partner.married && S.partner.aff < 18){
      logit("你們淡掉了，最後一則訊息沒人回。","bad",true); S.partner = null; S.exes++;
    }
  }
  S.kids.forEach(k => { if (S.age - k.born > 20) k.bond -= 1; });
}
function crisisCheck(){
  if (S.st.mood <= 2 && !S.flags.burnt){
    S.flags.burnt = true;
    pending = {t:"你撐不下去了", d:"某個早上你坐在床邊，發現自己完全起不來。",
      c:[{l:"去看醫生，請長假", e:{mood:36,health:6,cash:-50}, g:"", run:()=>{if(S.job&&Math.random()<0.5){S.job=null;logit("離開了那份工作。","bad");}badge("走出低潮");}},
         {l:"硬撐過去", e:{mood:16,health:-14}, g:"你沒告訴任何人。"},
         {l:"回家住一陣子", e:{mood:30,cash:-10,social:4}, g:"媽媽什麼都沒問，只是多煮了一道菜。"}]};
    return true;
  }
  if (S.st.mood > 20) S.flags.burnt = false;
  return false;
}
function deathCheck(){
  if (S.st.health <= 0){ die("身體先走一步，你撐到最後一刻。"); return true; }
  if (S.age < 45) {
    if (Math.random() < 0.0006) { die("一場意外，沒有任何預告。"); return true; }
    return false;
  }
  const base = Math.pow((S.age - 44) / 52, 3) * 0.5;
  const mod = 1 + (62 - S.st.health) / 45;
  if (Math.random() < base * Math.max(0.3, mod)) {
    die(S.age > 85 ? "在睡夢中離開，很安靜。" : "身體終究不聽話了。");
    return true;
  }
  if (S.age >= 104){ die("活到一百零四歲，報紙來採訪過兩次。"); return true; }
  return false;
}

function advanceYear(){
  if (!S.alive) return;
  S.age++;
  yearlyFocus();
  yearlyEconomy();
  yearlyDrift();

  const m = milestone();
  if (m) { pending = m; }
  else if (!crisisCheck()){
    // 選擇事件
    if (Math.random() < 0.32){
      const pool = CHOICE.filter(e => (!S.seen[e.id] || e.id==="invest"||e.id==="scam"||e.id==="affair") && safe(e.when));
      if (pool.length){
        const ev = weighted(pool);
        S.seen[ev.id] = true;
        pending = {t:ev.t, d:ev.dyn?ev.dyn():ev.d, c:ev.c};
      }
    }
    if (!pending && Math.random() < 0.5){
      const pool = AUTO.filter(e => safe(e.when));
      if (pool.length){
        const ev = weighted(pool);
        applyEff(ev.e); if (ev.run) ev.run();
        logit(ev.t, ev.tone);
      }
    }
  }
  render();
  if (deathCheck()) return;
  if (pending) openEvent();
}
function safe(fn){ try { return !!fn(); } catch(e){ return false; } }
function weighted(pool){
  const tot = pool.reduce((s,e)=>s+(e.w||1),0); let r = Math.random()*tot;
  for (const e of pool){ r -= (e.w||1); if (r<=0) return e; }
  return pool[0];
}

/* ===================== 結局 ===================== */
function die(reason){
  S.alive = false; S.deathReason = reason;
  speed = 0; syncSpeedBtns();
  logit("享年 "+S.age+" 歲。"+reason, "bad", true);
  showEnd();
}
function score(){
  const st = S.st;
  let v = st.health*0.8 + st.intel*0.9 + st.fit*0.6 + st.charm*0.6 + st.mood*1.8 + st.social*0.8;
  v += Math.min(Math.max(S.money,0), 6000) / 22;
  v += S.kids.length * 22 + S.kids.reduce((s,k)=>s+k.bond*0.12, 0);
  if (married()) v += 45;
  if (S.job) v += S.job.pres * 9;
  v += DEG_RANK[S.degree] * 12;
  v += S.age * 1.2;
  v += Object.keys(S.badges).length * 10;
  v -= S.exes * 14;
  return Math.max(0, Math.round(v));
}
function verdict(v){
  if (v > 900) return "一生難得";
  if (v > 760) return "活得很漂亮";
  if (v > 620) return "踏實的一生";
  if (v > 480) return "平凡但完整";
  if (v > 340) return "有點辛苦";
  return "來過，走過";
}
function epitaph(){
  const b = [];
  if (S.kids.length >= 3) b.push("子孫滿堂");
  if (S.money > 3000) b.push("留下不少錢");
  if (S.st.mood > 75) b.push("走的時候是笑的");
  if (S.exes >= 2) b.push("愛過很多次");
  if (!S.partner && S.kids.length === 0) b.push("一個人也走完了");
  if (S.st.health > 70) b.push("身體一直很好");
  if (S.badges["創業成功"]) b.push("自己當過老闆");
  if (S.age < 50) b.push("走得太早");
  return b.length ? b.join("・") : "平平安安";
}
function showEnd(){
  const v = score();
  const bs = Object.keys(S.badges);
  const el = document.getElementById("endScreen");
  el.innerHTML =
    '<div class="kicker">AGE '+S.age+' · END</div>'+
    '<h2>'+S.name+'，'+verdict(v)+'</h2>'+
    '<p class="body">'+S.deathReason+'<br>'+epitaph()+'</p>'+
    '<div class="score">'+v+'</div>'+
    '<div class="grid">'+
      row("學歷", S.degree) + row("最後職業", S.job?S.job.t:(S.retired?"退休":"無")) +
      row("資產", fmtMoney(S.money)) + row("子女", S.kids.length+" 人") +
      row("健康", Math.round(S.st.health)) + row("心情", Math.round(S.st.mood)) +
    '</div>'+
    (bs.length ? '<div class="badges">'+bs.map(b=>'<b>'+b+'</b>').join("")+'</div>' : '')+
    '<div class="choices"><button id="again">再活一次</button></div>'+
    (prevLives.length ? '<p class="body" style="margin-top:12px;font-size:11px;opacity:.6">前幾輩子：'+prevLives.map(p=>p.name+" "+p.age+"歲／"+p.score+"分").join("，")+'</p>' : '');
  el.classList.add("on");
  document.getElementById("again").onclick = resetAll;
  saveLife(v);
  document.getElementById("tapeSub").textContent = S.name+"．"+S.age+" 歲．"+verdict(v)+" "+v+" 分";
}
function row(k,v){ return '<span>'+k+'<em>'+v+'</em></span>'; }

/* ===================== 存檔（只存歷代成績） ===================== */
let prevLives = [];
function loadLives(){
  try { prevLives = JSON.parse(localStorage.getItem("lifemachine.lives") || "[]"); }
  catch(e){ prevLives = []; }
  if (!Array.isArray(prevLives)) prevLives = [];
}
function saveLife(v){
  try {
    prevLives.unshift({name:S.name, age:S.age, score:v});
    prevLives = prevLives.slice(0,4);
    localStorage.setItem("lifemachine.lives", JSON.stringify(prevLives));
  } catch(e){}
}

/* ===================== 畫面 ===================== */
const $ = id => document.getElementById(id);
let lastSprite = "";
function render(){
  if (!S) return;
  $("age").textContent = S.age;
  $("stageName").textContent = STAGE_INFO[stageKey()].n + (S.job ? "／"+S.job.t : "");
  $("cash").textContent = (S.money < 0 ? "-" : "") + "$" + fmtMoney(Math.abs(S.money));

  const sp = spriteFor();
  if (sp !== lastSprite){ $("sprite").innerHTML = spriteSVG(sp); lastSprite = sp; }

  $("bars").innerHTML = STAT_DEF.map(d => {
    const v = Math.round(S.st[d.k]);
    return '<div class="bar'+(v<25?' low':'')+'"><span>'+d.n+'<em>'+v+'</em></span><i><b style="width:'+v+'%"></b></i></div>';
  }).join("");

  const fam = [];
  if (S.partner) fam.push('<b>'+(S.partner.married?"配偶":"交往")+'</b> '+S.partner.name+' '+Math.round(S.partner.aff)+'%');
  if (S.kids.length) fam.push('<b>子女</b> '+S.kids.map(k=>k.name+"("+(S.age-k.born)+")").join("、"));
  if (S.house) fam.push('<b>房</b> '+S.house);
  $("family").innerHTML = fam.join("　") || '<span style="opacity:.4">一個人</span>';

  renderFocus();
  renderTicker();
}
function renderTicker(){
  const last = S.log.slice(-3);
  $("ticker").innerHTML = last.map(l => '<p><u>'+l.age+'</u>'+l.text+'</p>').join("") || '<p>故事還沒開始。</p>';
}
function renderTape(){
  const list = $("tapeList");
  list.innerHTML = S.log.map(l =>
    '<div class="'+(l.tone||"")+(l.key?" key":"")+'"><u>'+l.age+'</u><span>'+l.text+'</span></div>'
  ).join("");
  list.scrollTop = list.scrollHeight;
  $("tapeSub").textContent = S.name + "　" + S.origin.tag + "　" + S.age + " 歲";
}
function renderFocus(){
  const set = FOCUS_SETS[stageKey()] || FOCUS_SETS.work;
  if (!set.includes(S.focus)) S.focus = set[0];
  $("focusGrid").innerHTML = set.map(f =>
    '<button class="focus-btn" data-f="'+f+'" aria-pressed="'+(S.focus===f)+'">'+f+'</button>'
  ).join("");
  Array.prototype.forEach.call($("focusGrid").children, b => {
    b.onclick = () => { S.focus = b.dataset.f; renderFocus(); };
  });
}

/* ===================== 事件視窗 ===================== */
function openEvent(){
  const ev = pending; if (!ev) return;
  $("evAge").textContent = "AGE " + S.age;
  $("evTitle").textContent = ev.t;
  $("evText").textContent = ev.d;
  const box = $("evChoices"); box.innerHTML = "";
  ev.c.forEach(ch => {
    const b = document.createElement("button");
    b.innerHTML = ch.l + (ch.g ? '<small>'+ch.g+'</small>' : '');
    b.onclick = () => {
      $("event").classList.remove("on");
      pending = null;
      applyEff(ch.e);
      if (ch.g) logit(ch.g, null);
      if (ch.run) ch.run();
      render();
      if (pending) { openEvent(); return; }   // 連鎖事件（例如選科系）
      if (deathCheck()) return;
      renderTape();
    };
    box.appendChild(b);
  });
  $("event").classList.add("on");
}

/* ===================== 時間 ===================== */
const YEAR_MS = 2600;
let speed = 1, acc = 0, lastT = 0, running = false;
function modalOpen(){
  return $("event").classList.contains("on") ||
         $("startScreen").classList.contains("on") ||
         $("endScreen").classList.contains("on");
}
function frame(t){
  if (!lastT) lastT = t;
  const dt = Math.min(t - lastT, 200); lastT = t;
  if (running && speed > 0 && !modalOpen() && S && S.alive){
    acc += dt * speed;
    if (acc >= YEAR_MS){ acc = 0; advanceYear(); }
  }
  $("yearbar").style.width = (running && S && S.alive ? Math.min(acc/YEAR_MS,1)*100 : 0) + "%";
  requestAnimationFrame(frame);
}
function syncSpeedBtns(){
  [[0,"sp0"],[1,"sp1"],[2,"sp2"],[4,"sp4"]].forEach(p => {
    $(p[1]).setAttribute("aria-pressed", speed === p[0]);
  });
  $("speedLabel").textContent = speed === 0 ? "已暫停" : "一年約 " + (YEAR_MS/1000/speed).toFixed(1) + " 秒";
}
[[0,"sp0"],[1,"sp1"],[2,"sp2"],[4,"sp4"]].forEach(p => {
  $(p[1]).onclick = () => { speed = p[0]; acc = 0; syncSpeedBtns(); };
});
$("stepBtn").onclick = () => { if (S && S.alive && !modalOpen()){ acc = 0; advanceYear(); } };

/* ===================== 開場 ===================== */
function rollBirth(){
  const o = rollOrigin();
  const sex = Math.random() < 0.5 ? "M" : "F";
  draft = {o:o, sex:sex, name:makeName(sex)};
  $("birthTitle").textContent = draft.name + "・" + o.name;
  $("birthText").textContent = o.desc + "（" + (sex==="M"?"男":"女") + "）";
  $("rerollLeft").textContent = rerolls > 0 ? "還可以換 " + rerolls + " 次" : "沒得換了，認命吧";
}
$("btnReroll").onclick = () => { if (rerolls > 0){ rerolls--; rollBirth(); } };
$("btnStart").onclick = () => {
  S = newState(draft.o, draft.name, draft.sex);
  S.focus = "餵養照顧";
  logit(S.name + "出生了。" + S.origin.desc, null, true);
  $("startScreen").classList.remove("on");
  running = true; speed = 1; acc = 0; syncSpeedBtns();
  render(); renderTape();
};
function resetAll(){
  $("endScreen").classList.remove("on");
  $("event").classList.remove("on");
  rerolls = 3; S = null; pending = null; running = false; lastSprite = "";
  $("tapeList").innerHTML = '<div class="tape-empty">這台機器會把每一年印出來。</div>';
  $("tapeSub").textContent = "尚未出生";
  rollBirth();
  $("startScreen").classList.add("on");
}

loadLives();
rollBirth();
syncSpeedBtns();
requestAnimationFrame(frame);
})();
</script>
</body>
